name: One-shot update n8n limit

on:
  push:
    branches: ["feat/supabase-cloud-run"]
    paths: [".github/workflows/one-shot-update-n8n-limit.yml"]

permissions:
  contents: write

jobs:
  patch-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/supabase-cloud-run
          fetch-depth: 0

      - name: Update only scheduled sender limit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('n8n/workflows/ofertas-mvp-supabase.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          nodes = [node for node in data.get('nodes', []) if node.get('name') == 'Set Contexto Schedule Grupo']
          assert len(nodes) == 1, f'expected one schedule context node, found {len(nodes)}'
          code = nodes[0]['parameters']['jsCode']
          assert code.count('limit: 8,') == 1, 'expected exactly one limit: 8 in schedule context'
          nodes[0]['parameters']['jsCode'] = code.replace('limit: 8,', 'limit: 10,', 1)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit workflow synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add n8n/workflows/ofertas-mvp-supabase.json
          git commit -m "fix(n8n): aumenta schedule para 10 ofertas por hora"

      - name: Remove one-shot workflow and commit cleanup
        run: |
          git rm .github/workflows/one-shot-update-n8n-limit.yml
          git commit -m "chore: remove workflow temporario de sincronizacao"

      - name: Push commits
        run: git push origin HEAD:feat/supabase-cloud-run
